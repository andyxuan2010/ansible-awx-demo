---
- name: Install and configure OpenSSH Server on Windows
  hosts: "managed_nodes:&windows"
  gather_facts: false

  tasks:

    - name: Install Windows OpenSSH Server capability
      ansible.windows.win_powershell:
        script: |
          $capability = Get-WindowsCapability `
            -Online `
            -Name 'OpenSSH.Server~~~~0.0.1.0'

          if ($capability.State -ne 'Installed') {
              $result = Add-WindowsCapability `
                -Online `
                -Name 'OpenSSH.Server~~~~0.0.1.0'

              $Ansible.Changed = $true
              $Ansible.Result = @{
                  State         = 'Installed'
                  RestartNeeded = $result.RestartNeeded
              }
          }
          else {
              $Ansible.Changed = $false
              $Ansible.Result = @{
                  State         = 'Already installed'
                  RestartNeeded = $false
              }
          }

    - name: Set OpenSSH default shell to PowerShell
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\OpenSSH
        name: DefaultShell
        data: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
        type: string
        state: present

    - name: Ensure sshd service is automatic and running
      ansible.windows.win_service:
        name: sshd
        start_mode: auto
        state: started

    - name: Ensure OpenSSH firewall rule exists and is enabled
      ansible.windows.win_powershell:
        script: |
          $rule = Get-NetFirewallRule `
            -Name 'OpenSSH-Server-In-TCP' `
            -ErrorAction SilentlyContinue

          if (-not $rule) {
              New-NetFirewallRule `
                -Name 'OpenSSH-Server-In-TCP' `
                -DisplayName 'OpenSSH Server (sshd)' `
                -Enabled True `
                -Direction Inbound `
                -Protocol TCP `
                -Action Allow `
                -LocalPort 22

              $Ansible.Changed = $true
          }
          elseif ($rule.Enabled -ne 'True') {
              Enable-NetFirewallRule `
                -Name 'OpenSSH-Server-In-TCP'

              $Ansible.Changed = $true
          }
          else {
              $Ansible.Changed = $false
          }

    - name: Get sshd service information
      ansible.windows.win_service_info:
        name: sshd
      register: sshd_info

    - name: Verify sshd is running
      ansible.builtin.assert:
        that:
          - sshd_info.exists
          - sshd_info.services[0].state == 'started'
          - sshd_info.services[0].start_mode == 'auto'
        fail_msg: "OpenSSH sshd service is not correctly configured."
        success_msg: "OpenSSH sshd service is installed, automatic, and running."
